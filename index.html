<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <script>
      try {
        var raw = localStorage.getItem('ctrl_path_student_data_v1');
        var parsed = raw ? JSON.parse(raw) : null;
        var prefs = parsed && parsed.preferences;
        var theme = prefs && prefs.themeExplicit === true && prefs.theme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#070c18';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#F3F4FA';
        }
      } catch (e) {}
    </script>
    <title>CTRL+PATH — Academic Guidance Platform</title>
    <meta name="description" content="Magical academic guidance platform for first-year BSIT students at Batangas State University – Alangilan to explore Networking Technology, Business Analytics, and Service Management." />
